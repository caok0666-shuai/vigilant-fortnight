<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图书管理 - 社区智能书架</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

<header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-book-bookmark text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">图书管理后台</h1>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <a href="/" class="hover:underline"><i class="fa-solid fa-house mr-1"></i>读者主页</a>
      <a href="/admin" class="hover:underline"><i class="fa-solid fa-comment-dots mr-1"></i>感悟管理</a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

  <!-- 提示条 -->
  <div class="bg-blue-50 border border-blue-200 text-blue-800 rounded-xl p-4 text-sm flex items-start gap-3">
    <i class="fa-solid fa-circle-info mt-0.5"></i>
    <div>
      <p class="font-semibold">现在不需要再手工编辑 books.csv 了</p>
      <p class="mt-1 text-blue-700">
        在这里直接添加、修改、删除图书即可，数据会立即写入数据库并同步到网页和串口屏。
        <br>UID 请填写贴在书上的 RFID 标签编号（如 <code class="bg-blue-100 px-1 rounded">A0 13 1E E5</code>），
        可用「读卡器」页面或 Arduino 串口监视器读取。
      </p>
    </div>
  </div>

  <!-- 新增图书 -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
    <h2 class="text-lg font-bold mb-4 flex items-center">
      <i class="fa-solid fa-plus text-indigo-600 mr-2"></i><span id="form-title">添加新图书</span>
    </h2>
    <form id="book-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <div class="md:col-span-1">
        <label class="block text-sm font-semibold mb-1">RFID UID <span class="text-rose-500">*</span></label>
        <input id="f-uid" type="text" required
               class="w-full border rounded-lg px-3 py-2 text-sm font-mono uppercase"
               placeholder="A0 13 1E E5">
      </div>
      <div class="md:col-span-1">
        <label class="block text-sm font-semibold mb-1">书名 <span class="text-rose-500">*</span></label>
        <input id="f-title" type="text" required
               class="w-full border rounded-lg px-3 py-2 text-sm"
               placeholder="例：毛泽东选集第一卷">
      </div>
      <div class="md:col-span-1">
        <label class="block text-sm font-semibold mb-1">作者</label>
        <input id="f-author" type="text"
               class="w-full border rounded-lg px-3 py-2 text-sm"
               placeholder="例：毛泽东">
      </div>
      <div class="md:col-span-1 flex gap-2">
        <button type="submit" id="submit-btn"
                class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 font-semibold">
          <i class="fa-solid fa-check mr-1"></i><span id="submit-label">添加</span>
        </button>
        <button type="button" id="cancel-btn" onclick="resetForm()"
                class="hidden px-4 py-2 rounded-lg text-sm border border-slate-300 hover:bg-slate-50">
          取消
        </button>
      </div>
    </form>
    <p id="form-msg" class="mt-3 text-sm"></p>
  </div>

  <!-- 图书列表 -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
      <h2 class="text-lg font-bold flex items-center">
        <i class="fa-solid fa-list text-indigo-600 mr-2"></i>图书列表
        <span id="count" class="ml-2 text-sm font-normal text-slate-400"></span>
      </h2>
      <div class="flex gap-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input id="search" type="text" placeholder="搜索书名 / 作者 / UID"
                 class="border rounded-lg pl-9 pr-3 py-2 text-sm w-56">
        </div>
        <button onclick="exportCsv()" title="把当前数据导出成 books.csv 备份"
                class="px-3 py-2 text-sm border border-slate-300 rounded-lg hover:bg-slate-50">
          <i class="fa-solid fa-file-export mr-1"></i>导出 CSV
        </button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b text-left text-slate-500">
            <th class="py-2 pr-3 font-semibold">UID</th>
            <th class="py-2 pr-3 font-semibold">书名</th>
            <th class="py-2 pr-3 font-semibold">作者</th>
            <th class="py-2 pr-3 font-semibold">状态</th>
            <th class="py-2 pr-3 font-semibold">操作</th>
          </tr>
        </thead>
        <tbody id="book-rows"></tbody>
      </table>
    </div>
    <p id="empty" class="hidden text-center text-slate-400 py-10">暂无图书，请在上方添加</p>
  </div>

</main>

<script>
const API = "/api/books";
let books = [];
let editingUid = null;

// ---------- 读取列表 ----------
async function load(keyword = "") {
  const url = keyword ? `${API}?q=${encodeURIComponent(keyword)}` : API;
  const res = await fetch(url);
  books = await res.json();
  render();
}

function render() {
  const tbody = document.getElementById("book-rows");
  document.getElementById("count").textContent = `(共 ${books.length} 本)`;
  document.getElementById("empty").classList.toggle("hidden", books.length > 0);

  tbody.innerHTML = books.map(b => {
    const inShelf = b.status === "in";
    const badge = inShelf
      ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs">在架</span>'
      : '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-xs">借出</span>';
    return `
      <tr class="border-b hover:bg-slate-50">
        <td class="py-2 pr-3 font-mono text-xs">${escapeHtml(b.uid)}</td>
        <td class="py-2 pr-3 font-medium">${escapeHtml(b.title)}</td>
        <td class="py-2 pr-3 text-slate-600">${escapeHtml(b.author || "-")}</td>
        <td class="py-2 pr-3">${badge}</td>
        <td class="py-2 pr-3 whitespace-nowrap">
          <button onclick="editBook('${escapeAttr(b.uid)}')"
                  class="text-indigo-600 hover:underline mr-3 text-xs">
            <i class="fa-solid fa-pen"></i> 编辑
          </button>
          <button onclick="toggleStatus('${escapeAttr(b.uid)}', '${b.status}')"
                  class="text-slate-600 hover:underline mr-3 text-xs">
            <i class="fa-solid fa-rotate"></i> ${inShelf ? "设为借出" : "设为在架"}
          </button>
          <button onclick="delBook('${escapeAttr(b.uid)}')"
                  class="text-rose-600 hover:underline text-xs">
            <i class="fa-solid fa-trash"></i> 删除
          </button>
        </td>
      </tr>`;
  }).join("");
}

// ---------- 新增 / 修改 ----------
document.getElementById("book-form").onsubmit = async (e) => {
  e.preventDefault();
  const uid = document.getElementById("f-uid").value.trim().toUpperCase();
  const title = document.getElementById("f-title").value.trim();
  const author = document.getElementById("f-author").value.trim();
  if (!uid || !title) return;

  let res;
  if (editingUid) {
    res = await fetch(`${API}/${encodeURIComponent(editingUid)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid, title, author })
    });
  } else {
    res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid, title, author })
    });
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    showMsg(data.error || "操作失败", false);
    return;
  }
  showMsg(editingUid ? "修改成功" : "添加成功", true);
  resetForm();
  load(document.getElementById("search").value.trim());
};

function editBook(uid) {
  const b = books.find(x => x.uid === uid);
  if (!b) return;
  editingUid = uid;
  document.getElementById("f-uid").value = b.uid;
  document.getElementById("f-title").value = b.title;
  document.getElementById("f-author").value = b.author || "";
  document.getElementById("form-title").textContent = `修改图书：${b.title}`;
  document.getElementById("f-uid").readOnly = true;
  document.getElementById("f-uid").classList.add("bg-slate-100");
  document.getElementById("submit-label").textContent = "保存";
  document.getElementById("cancel-btn").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingUid = null;
  document.getElementById("book-form").reset();
  document.getElementById("f-uid").readOnly = false;
  document.getElementById("f-uid").classList.remove("bg-slate-100");
  document.getElementById("form-title").textContent = "添加新图书";
  document.getElementById("submit-label").textContent = "添加";
  document.getElementById("cancel-btn").classList.add("hidden");
}

async function toggleStatus(uid, current) {
  const status = current === "in" ? "out" : "in";
  await fetch(`${API}/${encodeURIComponent(uid)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status })
  });
  load(document.getElementById("search").value.trim());
}

async function delBook(uid) {
  if (!confirm(`确定删除 UID 为 ${uid} 的图书吗？\n该书的借还记录也会一并删除。`)) return;
  await fetch(`${API}/${encodeURIComponent(uid)}`, { method: "DELETE" });
  load(document.getElementById("search").value.trim());
}

async function exportCsv() {
  const res = await fetch(`${API}/export`, { method: "POST" });
  const data = await res.json();
  showMsg(`已导出 ${data.count} 本图书到 books.csv`, true);
}

// ---------- 搜索（输入防抖） ----------
let searchTimer = null;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => load(e.target.value.trim()), 250);
});

// ---------- 工具 ----------
function showMsg(text, ok) {
  const el = document.getElementById("form-msg");
  el.textContent = text;
  el.className = "mt-3 text-sm " + (ok ? "text-emerald-600" : "text-rose-600");
  setTimeout(() => { el.textContent = ""; }, 4000);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return String(s ?? "").replace(/'/g, "\\'"); }

load();
</script>
</body>
</html>
