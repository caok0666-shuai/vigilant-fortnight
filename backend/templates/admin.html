<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感悟管理 - 后端管理员</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-purple-700 text-white p-4 shadow">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <h1 class="text-xl font-bold">📋 感悟管理后台</h1>
    <a href="/" class="text-sm underline">← 返回主页</a>
  </div>
</header>

<main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">

  <!-- 添加感悟 -->
  <div class="bg-white rounded-xl p-6 shadow border">
    <h2 class="font-bold text-lg mb-4">➕ 添加感悟</h2>
    <form id="add-form" class="space-y-3">
      <div>
        <label class="text-sm font-semibold">书名</label>
        <input id="add-book" type="text" required class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="例：毛泽东选集第一卷">
      </div>
      <div>
        <label class="text-sm font-semibold">感悟内容</label>
        <textarea id="add-text" required rows="3" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="写点什么..."></textarea>
      </div>
      <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg text-sm hover:bg-purple-700">提交</button>
    </form>
  </div>

  <!-- 感悟列表 -->
  <div class="bg-white rounded-xl p-6 shadow border">
    <h2 class="font-bold text-lg mb-4">📝 全部感悟 <span id="count" class="text-sm text-gray-400"></span></h2>
    <div id="list" class="space-y-3"></div>
  </div>

</main>

<script>
const API = "/api/thoughts";

async function load() {
  const res = await fetch(API);
  const data = await res.json();
  document.getElementById("count").textContent = `(共 ${data.length} 条)`;
  const list = document.getElementById("list");
  if (data.length === 0) {
    list.innerHTML = '<p class="text-gray-400 text-center py-8">暂无感悟</p>';
    return;
  }
  list.innerHTML = data.map(t => `
    <div class="flex justify-between items-start p-4 rounded-lg border bg-gray-50">
      <div class="flex-1">
        <div class="font-bold text-purple-800">《${t.book}》</div>
        <div class="text-sm text-gray-700 mt-1">${t.text}</div>
        <div class="text-xs text-gray-400 mt-2">${t.time} | ID: ${t.id}</div>
      </div>
      <button onclick="del(${t.id})" class="ml-4 px-3 py-1 bg-red-500 text-white text-xs rounded hover:bg-red-600 shrink-0">
        🗑 删除
      </button>
    </div>
  `).join("");
}

async function del(id) {
  if (!confirm("确定删除这条感悟吗？")) return;
  await fetch(API + "/" + id, { method: "DELETE" });
  load();
}

document.getElementById("add-form").onsubmit = async (e) => {
  e.preventDefault();
  const book = document.getElementById("add-book").value.trim();
  const text = document.getElementById("add-text").value.trim();
  if (!book || !text) return;
  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ book, text })
  });
  document.getElementById("add-book").value = "";
  document.getElementById("add-text").value = "";
  load();
};

load();
</script>
</body>
</html>
